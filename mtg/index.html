<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Galdurspjöld, a custom card game</title>
  <link rel="stylesheet" href="styles.css">


</head>


<body>
  <div id="root"><div class="screen">
    <div class="landing">
      <div class="hero"><img src="title_wizards.png" alt="Two wizards duelling"></div>

      <h1 class="landing-title">Galdur</h1>
      <p class="landing-lede">Make custom cards. Play a friend, draft a bot, or fight the boss.</p>
      <p class="landing-meta">KS. CC open source, 2025.</p>

      <div class="card enter-card">
        <p class="text-sm text-gray mb-4">Enter the table. Build your own deck. The bot brings its own, or you can craft your opponent's too.</p>
        <button id="enterApp" class="btn btn-primary btn-lg">Enter</button>
      </div>
    </div>
  </div></div>
  <script src="modes.js" defer></script>
  <script src="app.js" defer></script>
  <script src="ai.js" defer></script>
  <script src="rules.js" defer></script>

</body></html>
