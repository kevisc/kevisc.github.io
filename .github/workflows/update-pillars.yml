name: update-pillars

on:
  schedule:
    - cron: "0 */3 * * *"   # every 3 hours
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-pillars
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --quiet yfinance pandas requests
      - name: Build market + macro JSON
        run: python pillars/build_data.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pillars/data/market.json pillars/data/macro.json
          if git diff --staged --quiet; then
            echo "No data changes."
          else
            git commit -m "pillars: refresh market & macro data"
            git push
          fi
