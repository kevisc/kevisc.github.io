<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="robots" content="noindex,nofollow,noarchive" />
    <title>Protected — us-macro</title>
    <style>
      :root { color-scheme: light dark; }
      html, body { height: 100%; margin: 0; }
      body { display: grid; place-items: center; background: #0a0a0a; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; }
      .card { width: min(520px, 92vw); background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); padding: 24px; border-radius: 16px; backdrop-filter: blur(8px); }
      h1 { margin: 0 0 8px 0; font-size: 20px; color: #fff; }
      p { margin: 6px 0; color: #c9c9c9; font-size: 13px; }
      label { display:block; margin: 14px 0 6px; color:#ddd; font-size: 12px; }
      input[type=password] { width: 100%; padding: 10px 12px; border-radius: 12px; border: 1px solid #3a3a3a; background:#111; color:#eee; }
      button { margin-top: 12px; width:100%; padding: 10px 12px; border-radius: 12px; border: 1px solid #9a5a1f; background:#f97316; color:#fff; font-weight:600; }
      .error { color: #ff8b8b; font-size:12px; min-height: 16px; }
      .meta { margin-top: 14px; font-size: 11px; color:#aaa; }
      #appwrap { display:none; width:min(1000px, 96vw); }
      #status { color:#ddd; font-size:13px; margin:10px 0; }
      #rootlog { background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.12); border-radius:12px; padding:10px; font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color:#dcdcdc; font-size:12px; max-height:36vh; overflow:auto; white-space:pre-wrap; }
      #root { min-height: 60vh; }
    </style>
  </head>
  <body>
    <div class="card" id="gate">
      <h1>Enter passphrase</h1>
      <p>This page is unlisted and lightly gated. For robust protection, use Cloudflare Access or a server-side auth proxy.</p>
      <label for="pw">Passphrase</label>
      <input id="pw" type="password" placeholder="••••••••" autocomplete="current-password" />
      <div class="error" id="err"></div>
      <button id="enter">Enter</button>
      <div class="meta">Preset passphrase configured. You can change it later by editing this file.</div>
    </div>

    <!-- Visible after unlock -->
    <div id="appwrap">
      <div id="status">Loading app…</div>
      <div id="rootlog"></div>
      <div id="root"></div>
    </div>

    <script>
    // --- Client-side gate (PBKDF2-SHA-256). Soft protection only. ---
    const APP_KEY = "us-macro";
    const SALT_B64 = "dXNtYWNyby1zYWx0LTIwMjU="; // base64 of 'usmacro-salt-2025'
    const ITER = 120000;
    const PASS_HASH = "3c0f4a2d6d4ec4f9337c81bce5f49b115c2cca94aab196885e5a08491a1b5b55";  // derived from password 'usmacro25'

    const logEl = () => document.getElementById('rootlog');
    const statusEl = () => document.getElementById('status');
    const boot = (msg) => { const el = logEl(); if (el) { el.textContent += (el.textContent ? "\n" : "") + msg; } console.log("[gate]", msg); };

    async function deriveHex(pass, saltB64, iter) {
      const enc = new TextEncoder();
      const salt = Uint8Array.from(atob(saltB64), c => c.charCodeAt(0));
      const keyMaterial = await crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveBits"]);
      const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", iterations: iter, salt }, keyMaterial, 256);
      const bytes = new Uint8Array(bits);
      return Array.from(bytes).map(b=>b.toString(16).padStart(2,"0")).join("");
    }

    function saveUnlock() { sessionStorage.setItem("gate-ok-" + APP_KEY, PASS_HASH); }
    function hasUnlock() { return sessionStorage.getItem("gate-ok-" + APP_KEY) === PASS_HASH; }

    async function unlock(pass) {
      try {
        const hex = await deriveHex(pass, SALT_B64, ITER);
        if (hex === PASS_HASH) {
          saveUnlock();
          document.getElementById("gate").style.display = "none";
          document.getElementById("appwrap").style.display = "block";
          await loadApp();
        } else {
          document.getElementById("err").textContent = "Incorrect passphrase.";
        }
      } catch (e) {
        document.getElementById("err").textContent = "Crypto failed: " + e;
      }
    }

    function loadScript(src, attrs={}) {
      return new Promise((resolve, reject) => {
        const s = document.createElement("script");
        s.src = src;
        Object.entries(attrs).forEach(([k,v]) => s.setAttribute(k, v));
        s.onload = () => { boot("Loaded: " + src); resolve(); };
        s.onerror = () => { boot("FAILED: " + src); reject(new Error("Failed to load " + src)); };
        document.body.appendChild(s);
      });
    }

    async function loadApp() {
      boot("Starting loader…");
      try {
        statusEl().textContent = "Loading libraries…";
        await loadScript("https://cdn.tailwindcss.com");
        await loadScript("https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js");
        await loadScript("https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js");
        await loadScript("https://cdn.jsdelivr.net/npm/prop-types@15.8.1/prop-types.min.js");
        await loadScript("https://cdn.jsdelivr.net/npm/recharts@2.12.7/umd/Recharts.min.js");
        await loadScript("https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js");
        statusEl().textContent = "Loading app code…";
        try {
          await loadScript("app.secure.jsx", { type:"text/babel", "data-plugins":"transform-react-jsx" });
          boot("Found app.secure.jsx");
        } catch (e) {
          boot("app.secure.jsx missing — trying app.jsx");
          await loadScript("app.jsx", { type:"text/babel", "data-plugins":"transform-react-jsx" });
        }
        if (window.Babel && window.Babel.transformScriptTags) { window.Babel.transformScriptTags(); boot("Babel transform complete."); }
        statusEl().textContent = "App loaded. If nothing appears, check console for React errors inside app code.";
      } catch (e) {
        const msg = "Loader error: " + e.message;
        boot(msg);
        statusEl().textContent = msg;
      }
    }

    document.getElementById("enter").addEventListener("click", () => unlock(document.getElementById("pw").value));
    document.getElementById("pw").addEventListener("keydown", (e)=>{ if (e.key === "Enter") unlock(e.target.value); });

    if (hasUnlock()) {
      document.getElementById("gate").style.display = "none";
      document.getElementById("appwrap").style.display = "block";
      loadApp();
    }
    </script>
  </body>
</html>
