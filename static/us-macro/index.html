<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="robots" content="noindex,nofollow,noarchive" />
    <title>Protected — us-macro</title>
    <style>
      :root { color-scheme: light dark; }
      html, body { height: 100%; margin: 0; }
      body { display: grid; place-items: center; background: #0a0a0a; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, Apple Color Emoji, Segoe UI Emoji; }
      .card { width: min(480px, 90vw); background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); padding: 24px; border-radius: 16px; backdrop-filter: blur(8px); }
      h1 { margin: 0 0 8px 0; font-size: 20px; color: #fff; }
      p { margin: 6px 0; color: #c9c9c9; font-size: 13px; }
      label { display:block; margin: 14px 0 6px; color:#ddd; font-size: 12px; }
      input[type=password] { width: 100%; padding: 10px 12px; border-radius: 12px; border: 1px solid #3a3a3a; background:#111; color:#eee; }
      button { margin-top: 12px; width:100%; padding: 10px 12px; border-radius: 12px; border: 1px solid #9a5a1f; background:#f97316; color:#fff; font-weight:600; }
      .error { color: #ff8b8b; font-size:12px; min-height: 16px; }
      .meta { margin-top: 14px; font-size: 11px; color:#aaa; }
      #root { display:none; }
    </style>
  </head>
  <body>
    <div class="card" id="gate">
      <h1>Enter passphrase</h1>
      <p>This page is unlisted and lightly gated. For robust protection, use Cloudflare Access or a server-side auth proxy.</p>
      <label for="pw">Passphrase</label>
      <input id="pw" type="password" placeholder="••••••••" autocomplete="current-password" />
      <div class="error" id="err"></div>
      <button id="enter">Enter</button>
      <div class="meta">Tip: to change the password, edit this file’s <code>PASS_HASH</code>, <code>SALT_B64</code>, and <code>ITER</code> constants using the helper in the inline code comments.</div>
    </div>

    <!-- App mount point (hidden until unlocked) -->
    <div id="root"></div>

    <script>
    // --- Simple client-side gate (PBKDF2-SHA-256). Soft protection only. ---
    // CHANGE ME: create your own salt+hash using the helper below.
    const APP_KEY = "us-macro";
    const SALT_B64 = "bXktc2FsdC1kZW1v"; // base64("my-salt-demo") — change this
    const ITER = 120000;                  // PBKDF2 iterations — you can increase
    const PASS_HASH = "5c7d1d2c7fd3c0d1e4a2c70a0e5a6a4e5d8f7f8f6d0b1a2c3d4e5f6a7b8c9d0"; // demo hash for 'demo' (replace)

    // Helper to compute a derived key hex for your own passphrase:
    // 1) Open DevTools console on this page
    // 2) Run: await deriveHex("your-pass-here", "your-salt-b64", ITER)
    // 3) Replace PASS_HASH and SALT_B64 constants above with your values
    async function deriveHex(pass, saltB64, iter) {
      const enc = new TextEncoder();
      const salt = Uint8Array.from(atob(saltB64), c => c.charCodeAt(0));
      const keyMaterial = await crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveBits"]);
      const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", iterations: iter, salt }, keyMaterial, 256);
      const bytes = new Uint8Array(bits);
      return Array.from(bytes).map(b=>b.toString(16).padStart(2,"0")).join("");
    }

    function saveUnlock() { sessionStorage.setItem("gate-ok-" + APP_KEY, PASS_HASH); }
    function hasUnlock() { return sessionStorage.getItem("gate-ok-" + APP_KEY) === PASS_HASH; }

    async function unlock(pass) {
      try {
        const hex = await deriveHex(pass, SALT_B64, ITER);
        if (hex === PASS_HASH) {
          saveUnlock();
          document.getElementById("gate").style.display = "none";
          document.getElementById("root").style.display = "block";
          await loadApp();
        } else {
          document.getElementById("err").textContent = "Incorrect passphrase.";
        }
      } catch (e) {
        document.getElementById("err").textContent = "Crypto failed: " + e;
      }
    }

    async function loadScript(src, attrs={}) {
      return new Promise((resolve, reject) => {
        const s = document.createElement("script");
        s.src = src;
        Object.entries(attrs).forEach(([k,v]) => s.setAttribute(k, v));
        s.onload = resolve; s.onerror = () => reject(new Error("Failed to load " + src));
        document.body.appendChild(s);
      });
    }

    async function loadApp() {
      // Load dependencies only after unlock
      await loadScript("https://cdn.tailwindcss.com");
      await loadScript("https://unpkg.com/react@18/umd/react.production.min.js");
      await loadScript("https://unpkg.com/react-dom@18/umd/react-dom.production.min.js");
      await loadScript("https://cdn.jsdelivr.net/npm/prop-types@15.8.1/prop-types.min.js");
      await loadScript("https://cdn.jsdelivr.net/npm/recharts@2.12.7/umd/Recharts.min.js");
      await loadScript("https://unpkg.com/@babel/standalone/babel.min.js");
      await loadScript("app.secure.jsx", {"type":"text/babel","data-plugins":"transform-react-jsx"});
      if (window.Babel && window.Babel.transformScriptTags) window.Babel.transformScriptTags();
    }

    // Wire UI
    document.getElementById("enter").addEventListener("click", () => unlock(document.getElementById("pw").value));
    document.getElementById("pw").addEventListener("keydown", (e)=>{ if (e.key === "Enter") unlock(e.target.value); });

    // Auto-load if already unlocked this session
    if (hasUnlock()) {
      document.getElementById("gate").style.display = "none";
      document.getElementById("root").style.display = "block";
      loadApp();
    }
    </script>
  </body>
</html>
