<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cross-Section vs Panel — Interactive</title>

    <!-- Tailwind (CDN) — fine for unlisted demos -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React + ReactDOM UMD (CDN) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Recharts UMD (CDN first) -->
    <script
      src="https://unpkg.com/recharts/umd/Recharts.min.js"
      onerror="(function(){var s=document.createElement('script'); s.src='/stats/vendor/Recharts.min.js'; document.head.appendChild(s);})();"
    ></script>

    <!-- If CSP blocked the CDN (no onerror), add a tiny guard to load local after DOMContentLoaded -->
    <script>
      (function(){
        function ensureRecharts(){
          if (window.Recharts) return;
          var s=document.createElement('script');
          s.src='/stats/vendor/Recharts.min.js';
          document.head.appendChild(s);
        }
        document.addEventListener('DOMContentLoaded', function(){
          setTimeout(ensureRecharts, 1500);
        });
      })();
    </script>

    <!-- Babel standalone to transpile JSX in-browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body class="bg-neutral-950 text-neutral-100">
    <div id="root"></div>
    <noscript>
      <div class="max-w-xl mx-auto mt-8 p-4 bg-neutral-900/70 text-neutral-200 rounded-xl">
        This page requires JavaScript (React) enabled.
      </div>
    </noscript>

    <!-- Your app (cache-busted) -->
    <script type="text/babel" data-presets="env,react" src="./app.jsx?v=20251014b"></script>
  </body>
</html>
