<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Card Game Platform</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; background: #111827; color: #f3f4f6; }
    button { cursor: pointer; font-family: inherit; border: none; }
    input, select, textarea { font-family: inherit; }
    .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
    .screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { background: #1f2937; border: 1px solid #374151; border-radius: 8px; padding: 20px; }
    .btn { padding: 12px 24px; border-radius: 8px; font-weight: 600; transition: all 0.2s; }
    .btn-primary { background: #3b82f6; color: white; }
    .btn-primary:hover { background: #2563eb; }
    .btn-secondary { background: #1f2937; color: #f3f4f6; border: 1px solid #374151; }
    .btn-secondary:hover { background: #374151; }
    .btn-green { background: #059669; color: white; }
    .btn-green:hover { background: #047857; }
    .btn-blue { background: #1e40af; color: white; }
    .btn-blue:hover { background: #1e3a8a; }
    .btn-red { background: #dc2626; color: white; }
    .btn-red:hover { background: #b91c1c; }
    .input { width: 100%; padding: 10px 15px; background: #374151; color: #f3f4f6; border: 1px solid #4b5563; border-radius: 6px; }
    .input:focus { outline: none; border-color: #6b7280; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
    .grid { display: grid; gap: 20px; }
    .grid-2 { grid-template-columns: repeat(2, 1fr); }
    .grid-4 { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
    .text-center { text-align: center; }
    .mb-4 { margin-bottom: 16px; }
    .mb-8 { margin-bottom: 32px; }
    .mt-4 { margin-top: 16px; }
    .p-4 { padding: 16px; }
    .hidden { display: none; }
    .card-preview { background: #374151; border-radius: 8px; padding: 12px; border: 1px solid #4b5563; }
    .card-img { width: 100%; aspect-ratio: 5/7; background: #4b5563; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 48px; }
    .game-field { background: rgba(220, 38, 38, 0.1); border-radius: 8px; padding: 8px; min-height: 120px; border: 2px solid #4b5563; }
    .game-field.player { background: rgba(34, 197, 94, 0.1); }
    .hand-card { display: inline-block; margin: 4px; transition: transform 0.2s; }
    .hand-card:hover { transform: translateY(-8px); }
    .hand-card img { width: 64px; height: 80px; border-radius: 4px; border: 2px solid #4b5563; object-fit: cover; }
    .hand-card.selected img { border-color: #fbbf24; }
    .field-card { display: inline-block; margin: 4px; }
    .field-card img { width: 60px; height: 84px; border-radius: 4px; border: 2px solid #3b82f6; object-fit: cover; }
    .sidebar { width: 260px; background: #1f2937; border-left: 1px solid #374151; padding: 16px; overflow-y: auto; }
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; z-index: 1000; }
    .modal-content { background: #1f2937; border: 1px solid #374151; border-radius: 8px; padding: 24px; max-width: 600px; width: 90%; max-height: 80vh; overflow-y: auto; }
    .icon { width: 20px; height: 20px; display: inline-block; vertical-align: middle; }
    .flex { display: flex; gap: 8px; align-items: center; }
    .justify-between { justify-content: space-between; }
    .text-sm { font-size: 14px; }
    .text-xs { font-size: 12px; }
    .text-gray { color: #9ca3af; }
    .text-red { color: #f87171; }
    .text-green { color: #4ade80; }
    .text-blue { color: #60a5fa; }
    .deck-card { display: inline-block; position: relative; margin: 4px; }
    .deck-card img { width: 80px; height: 112px; border-radius: 4px; border: 2px solid #4b5563; cursor: pointer; object-fit: cover; }
    .deck-card:hover img { border-color: #3b82f6; }
    .remove-btn { position: absolute; top: 0; right: 0; background: #dc2626; color: white; border-radius: 4px; padding: 2px 6px; font-size: 10px; display: none; }
    .deck-card:hover .remove-btn { display: block; }
    label { display: block; margin-bottom: 8px; color: #d1d5db; font-size: 14px; }
    textarea { resize: vertical; min-height: 80px; }
  </style>
</head>
<body>
  <div id="root"></div>
  
  <script>
(function(){
'use strict';

const state = {
  screen: 'login',
  currentPlayer: null,
  cards: [
    { id: 1, name: 'Fire Dragon', type: 'Monster', attack: 2500, defense: 2000, effect: 'When summoned, deal 500 damage to opponent.', image: '' },
    { id: 2, name: 'Magic Shield', type: 'Spell', attack: 0, defense: 0, effect: 'Negate one attack this turn.', image: '' }
  ],
  decks: { player1: [], player2: [] },
  editingCard: null,
  activePlayer: 1,
  gameState: {
    player1: { hand: [], upperField: [], lowerField: [], graveyard: [], deck: [], health: 20 },
    player2: { hand: [], upperField: [], lowerField: [], graveyard: [], deck: [], health: 20 }
  },
  gameStarted: false,
  winner: null,
  selectedCard: null,
  hoveredCard: null,
  viewingGraveyard: null,
  onlineMode: false,
  peerConnection: null,
  dataChannel: null,
  roomCode: null,
  isHost: false,
  waitingForAnswer: false,
  answerCode: null
};

function compressImage(file, callback) {
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const maxW = 200, maxH = 200;
      let w = img.width, h = img.height;
      if (w > h) { if (w > maxW) { h *= maxW / w; w = maxW; } }
      else { if (h > maxH) { w *= maxH / h; h = maxH; } }
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      callback(canvas.toDataURL('image/jpeg', 0.7));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function checkWinner() {
  if (state.gameStarted) {
    if (state.gameState.player1.health <= 0) { state.winner = 2; state.gameStarted = false; }
    else if (state.gameState.player2.health <= 0) { state.winner = 1; state.gameStarted = false; }
  }
}

function sendGameUpdate() {
  if (state.onlineMode && state.dataChannel && state.dataChannel.readyState === 'open') {
    state.dataChannel.send(JSON.stringify({
      type: 'gameUpdate',
      gameState: state.gameState,
      gameStarted: state.gameStarted,
      activePlayer: state.activePlayer,
      winner: state.winner
    }));
  }
}

function setupDataChannel(channel) {
  state.dataChannel = channel;
  
  state.dataChannel.onopen = () => {
    console.log('Connected!');
    state.dataChannel.send(JSON.stringify({ type: 'deckSync', decks: state.decks }));
  };
  
  state.dataChannel.onmessage = (event) => {
    try {
      const data = JSON.parse(event.data);
      if (data.type === 'deckSync') {
        const oppKey = 'player' + (state.currentPlayer === 1 ? 2 : 1);
        if (data.decks[oppKey]) state.decks[oppKey] = data.decks[oppKey];
        render();
      } else if (data.type === 'gameUpdate') {
        state.gameState = data.gameState;
        state.gameStarted = data.gameStarted;
        state.activePlayer = data.activePlayer;
        state.winner = data.winner;
        render();
      }
    } catch(e) { console.error(e); }
  };
  
  state.dataChannel.onclose = () => {
    alert('Connection closed');
    disconnectOnline();
    state.screen = 'menu';
    render();
  };
}

async function createOnlineRoom() {
  state.isHost = true;
  state.onlineMode = true;
  state.roomCode = 'waiting';
  
  const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
  state.peerConnection = pc;
  
  setupDataChannel(pc.createDataChannel('game'));
  
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  
  await new Promise(resolve => {
    if (pc.iceGatheringState === 'complete') resolve();
    else pc.onicegatheringstatechange = () => { if (pc.iceGatheringState === 'complete') resolve(); };
  });
  
  state.roomCode = btoa(JSON.stringify({ offer: pc.localDescription }));
  state.waitingForAnswer = true;
  render();
}

async function joinOnlineRoom(offerStr) {
  state.isHost = false;
  state.onlineMode = true;
  state.roomCode = 'connecting';
  
  try {
    const data = JSON.parse(atob(offerStr));
    const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
    state.peerConnection = pc;
    
    pc.ondatachannel = (e) => setupDataChannel(e.channel);
    await pc.setRemoteDescription(new RTCSessionDescription(data.offer));
    
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    
    await new Promise(resolve => {
      if (pc.iceGatheringState === 'complete') resolve();
      else pc.onicegatheringstatechange = () => { if (pc.iceGatheringState === 'complete') resolve(); };
    });
    
    state.answerCode = btoa(JSON.stringify({ answer: pc.localDescription }));
    render();
  } catch(e) {
    alert('Invalid code: ' + e.message);
    disconnectOnline();
    state.screen = 'menu';
    render();
  }
}

async function completeConnection(answerStr) {
  try {
    const data = JSON.parse(atob(answerStr));
    await state.peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
    state.waitingForAnswer = false;
    render();
  } catch(e) {
    alert('Invalid answer: ' + e.message);
  }
}

function disconnectOnline() {
  if (state.dataChannel) state.dataChannel.close();
  if (state.peerConnection) state.peerConnection.close();
  state.dataChannel = null;
  state.peerConnection = null;
  state.onlineMode = false;
  state.roomCode = null;
  state.isHost = false;
  state.waitingForAnswer = false;
  state.answerCode = null;
}

function saveDeck() {
  const key = 'player' + state.currentPlayer;
  const data = JSON.stringify({ player: state.currentPlayer, cards: state.decks[key], timestamp: Date.now() });
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'deck_player' + state.currentPlayer + '.json';
  a.click();
  URL.revokeObjectURL(url);
}

function loadDeck(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      state.decks['player' + state.currentPlayer] = data.cards || [];
      render();
    } catch(err) {
      alert('Error loading deck');
    }
  };
  reader.readAsText(file);
}

function render() {
  const root = document.getElementById('root');
  if (!root) return;
  root.innerHTML = '';
  
  if (state.screen === 'login') root.appendChild(LoginScreen());
  else if (state.screen === 'menu') root.appendChild(MainMenu());
  else if (state.screen === 'creator') root.appendChild(CardCreator());
  else if (state.screen === 'builder') root.appendChild(DeckBuilder());
  else if (state.screen === 'game') root.appendChild(GameBoard());
}

function LoginScreen() {
  const div = document.createElement('div');
  div.className = 'screen';
  div.innerHTML = `
    <div class="text-center">
      <h1 style="font-size: 48px; font-weight: bold; margin-bottom: 12px;">Card Game Platform</h1>
      <p class="text-gray mb-8">Select your player</p>
      <div class="flex" style="gap: 24px;">
        <button id="p1btn" class="btn btn-secondary" style="padding: 32px 48px; font-size: 20px;">Player 1</button>
        <button id="p2btn" class="btn btn-secondary" style="padding: 32px 48px; font-size: 20px;">Player 2</button>
      </div>
    </div>
  `;
  div.querySelector('#p1btn').onclick = () => { state.currentPlayer = 1; state.screen = 'menu'; render(); };
  div.querySelector('#p2btn').onclick = () => { state.currentPlayer = 2; state.screen = 'menu'; render(); };
  return div;
}

function MainMenu() {
  const div = document.createElement('div');
  div.className = 'screen';
  div.innerHTML = `
    <div style="max-width: 600px;">
      <div class="header">
        <div></div>
        <h1 style="font-size: 32px; font-weight: bold;">Player ${state.currentPlayer}</h1>
        <button id="logoutBtn" class="btn btn-secondary text-sm">Logout</button>
      </div>
      <div class="grid" style="gap: 16px;">
        <button id="createBtn" class="btn btn-secondary" style="padding: 24px;">Create Cards</button>
        <button id="buildBtn" class="btn btn-secondary" style="padding: 24px;">Build Deck</button>
        <button id="playBtn" class="btn btn-secondary" style="padding: 24px;">Play Local Game</button>
        <div style="border-top: 1px solid #374151; margin: 16px 0; padding-top: 16px;">
          <p class="text-gray text-sm mb-4">🌐 Online Multiplayer</p>
          <button id="hostBtn" class="btn btn-blue mb-4" style="width: 100%; padding: 16px;">Host Online Game</button>
          <button id="joinBtn" class="btn btn-green" style="width: 100%; padding: 16px;">Join Online Game</button>
        </div>
      </div>
    </div>
  `;
  
  div.querySelector('#logoutBtn').onclick = () => { state.currentPlayer = null; state.screen = 'login'; render(); };
  div.querySelector('#createBtn').onclick = () => { state.screen = 'creator'; render(); };
  div.querySelector('#buildBtn').onclick = () => { state.screen = 'builder'; render(); };
  div.querySelector('#playBtn').onclick = () => { state.onlineMode = false; state.screen = 'game'; render(); };
  div.querySelector('#hostBtn').onclick = () => {
    if (state.decks['player' + state.currentPlayer].length === 0) { alert('Build a deck first!'); return; }
    createOnlineRoom();
    state.screen = 'game';
    render();
  };
  div.querySelector('#joinBtn').onclick = () => {
    if (state.decks['player' + state.currentPlayer].length === 0) { alert('Build a deck first!'); return; }
    const code = prompt('Paste connection code:');
    if (code && code.trim()) { joinOnlineRoom(code.trim()); state.screen = 'game'; render(); }
  };
  
  return div;
}

function CardCreator() {
  const form = state.editingCard || { name: '', type: 'Monster', attack: 0, defense: 0, effect: '', image: '' };
  const div = document.createElement('div');
  div.className = 'container';
  
  const cardsHtml = state.cards.map((c, i) => `
    <div class="card-preview" style="position: relative;">
      <div style="background: #4b5563; padding: 8px; border-radius: 6px 6px 0 0; margin-bottom: 8px;">
        <h3 style="font-weight: bold; text-align: center; font-size: 14px;">${c.name || 'Unnamed'}</h3>
        <p class="text-xs text-gray text-center">${c.type}</p>
      </div>
      <div class="card-img">${c.image ? `<img src="${c.image}" style="width:100%; height:100%; object-fit:cover; border-radius:6px;">` : '🃏'}</div>
      ${c.type === 'Monster' ? `<div style="background: #4b5563; padding: 8px; border-radius: 6px; margin: 8px 0; display: flex; justify-content: space-between;"><span class="text-sm">ATK: ${c.attack}</span><span class="text-sm">DEF: ${c.defense}</span></div>` : ''}
      <div style="background: #4b5563; padding: 8px; border-radius: 6px;"><p class="text-xs">${c.effect || 'No effect'}</p></div>
      <div style="position: absolute; top: 8px; right: 8px; display: flex; gap: 4px;">
        <button class="btn btn-secondary text-xs editCard" data-id="${i}" style="padding: 4px 8px;">Edit</button>
        <button class="btn btn-red text-xs delCard" data-id="${i}" style="padding: 4px 8px;">Del</button>
      </div>
    </div>
  `).join('');
  
  div.innerHTML = `
    <div class="header">
      <button id="backBtn" class="btn btn-secondary text-sm">← Back</button>
      <button id="logoutBtn" class="btn btn-secondary text-sm">Logout</button>
    </div>
    <h1 class="mb-8" style="font-size: 28px; font-weight: bold;">${state.editingCard ? 'Edit Card' : 'Create New Card'}</h1>
    <div class="grid grid-2">
      <div class="card">
        <div class="mb-4">
          <label>Card Name</label>
          <input id="cardName" class="input" value="${form.name}">
        </div>
        <div class="mb-4">
          <label>Type</label>
          <select id="cardType" class="input">
            <option value="Monster">Monster</option>
            <option value="Spell">Spell</option>
            <option value="Trap">Trap</option>
          </select>
        </div>
        <div id="monsterStats" class="mb-4" style="${form.type !== 'Monster' ? 'display:none' : ''}">
          <div class="mb-4">
            <label>Attack</label>
            <input id="cardAtk" class="input" type="number" value="${form.attack}">
          </div>
          <div>
            <label>Defense</label>
            <input id="cardDef" class="input" type="number" value="${form.defense}">
          </div>
        </div>
        <div class="mb-4">
          <label>Effect</label>
          <textarea id="cardEffect" class="input">${form.effect}</textarea>
        </div>
        <div class="mb-4">
          <label>Image</label>
          <input id="cardImage" class="input" type="file" accept="image/*">
        </div>
        <button id="submitCard" class="btn btn-primary" style="width: 100%; padding: 16px;">${state.editingCard ? 'Update' : 'Create'}</button>
      </div>
      <div>
        <h2 class="mb-4" style="font-size: 18px; font-weight: bold;">Preview</h2>
        <div id="preview"></div>
      </div>
    </div>
    <div class="mt-4">
      <h2 class="mb-4" style="font-size: 18px; font-weight: bold;">Your Cards</h2>
      <div class="grid grid-4">${cardsHtml}</div>
    </div>
  `;
  
  div.querySelector('#backBtn').onclick = () => { state.screen = 'menu'; state.editingCard = null; render(); };
  div.querySelector('#logoutBtn').onclick = () => { state.currentPlayer = null; state.screen = 'login'; render(); };
  div.querySelector('#cardType').value = form.type;
  
  const updatePreview = () => {
    form.name = div.querySelector('#cardName').value;
    form.type = div.querySelector('#cardType').value;
    form.attack = parseInt(div.querySelector('#cardAtk').value) || 0;
    form.defense = parseInt(div.querySelector('#cardDef').value) || 0;
    form.effect = div.querySelector('#cardEffect').value;
    div.querySelector('#monsterStats').style.display = form.type === 'Monster' ? 'block' : 'none';
    div.querySelector('#preview').innerHTML = `
      <div class="card-preview">
        <div style="background: #4b5563; padding: 8px; border-radius: 6px 6px 0 0; margin-bottom: 8px;">
          <h3 style="font-weight: bold; text-align: center;">${form.name || 'Unnamed'}</h3>
          <p class="text-xs text-gray text-center">${form.type}</p>
        </div>
        <div class="card-img">${form.image ? `<img src="${form.image}" style="width:100%; height:100%; object-fit:cover; border-radius:6px;">` : '🃏'}</div>
        ${form.type === 'Monster' ? `<div style="background: #4b5563; padding: 8px; border-radius: 6px; margin: 8px 0; display: flex; justify-content: space-between;"><span>ATK: ${form.attack}</span><span>DEF: ${form.defense}</span></div>` : ''}
        <div style="background: #4b5563; padding: 8px; border-radius: 6px;"><p class="text-xs">${form.effect || 'No effect'}</p></div>
      </div>
    `;
  };
  
  div.querySelector('#cardName').oninput = updatePreview;
  div.querySelector('#cardType').onchange = updatePreview;
  div.querySelector('#cardAtk').oninput = updatePreview;
  div.querySelector('#cardDef').oninput = updatePreview;
  div.querySelector('#cardEffect').oninput = updatePreview;
  div.querySelector('#cardImage').onchange = (e) => {
    const file = e.target.files[0];
    if (file) compressImage(file, (img) => { form.image = img; updatePreview(); });
  };
  div.querySelector('#submitCard').onclick = () => {
    if (state.editingCard) {
      const idx = state.cards.findIndex(c => c.id === state.editingCard.id);
      state.cards[idx] = Object.assign({}, form, { id: state.editingCard.id });
      state.editingCard = null;
    } else {
      state.cards.push(Object.assign({}, form, { id: Date.now() }));
    }
    render();
  };
  
  div.querySelectorAll('.editCard').forEach((btn, i) => {
    btn.onclick = () => { state.editingCard = state.cards[i]; render(); window.scrollTo(0, 0); };
  });
  div.querySelectorAll('.delCard').forEach((btn, i) => {
    btn.onclick = () => { state.cards.splice(i, 1); render(); };
  });
  
  updatePreview();
  return div;
}

function DeckBuilder() {
  const key = 'player' + state.currentPlayer;
  const div = document.createElement('div');
  div.className = 'container';
  
  const cardImg = (c) => c.image || `data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="140"><rect width="100" height="140" fill="%23374151"/><text x="50" y="70" text-anchor="middle" fill="white" font-size="10">${encodeURIComponent(c.name)}</text></svg>`;
  
  const deckHtml = state.decks[key].map((c, i) => `
    <div class="deck-card">
      <img src="${cardImg(c)}">
      <button class="remove-btn remCard" data-id="${i}">✕</button>
    </div>
  `).join('');
  
  const availHtml = state.cards.map((c, i) => `
    <div class="deck-card addCard" data-id="${i}">
      <img src="${cardImg(c)}">
    </div>
  `).join('');
  
  div.innerHTML = `
    <div class="header">
      <button id="backBtn" class="btn btn-secondary text-sm">← Back</button>
      <h2 style="font-size: 20px;">Deck: Player ${state.currentPlayer}</h2>
      <div class="flex">
        <button id="saveDeck" class="btn btn-blue text-sm">💾 Save</button>
        <label class="btn btn-green text-sm" style="margin: 0;">
          📁 Load
          <input type="file" id="loadDeck" accept=".json" style="display: none;">
        </label>
        <button id="logoutBtn" class="btn btn-secondary text-sm">Logout</button>
      </div>
    </div>
    <div class="grid grid-2">
      <div class="card">
        <h3 class="mb-4" style="font-weight: bold;">Main Deck [${state.decks[key].length}]</h3>
        <div style="background: #1f2937; padding: 16px; border-radius: 8px; min-height: 200px;">
          ${deckHtml || '<p class="text-gray text-center" style="padding: 32px 0;">No cards in deck</p>'}
        </div>
      </div>
      <div class="card">
        <h3 class="mb-4" style="font-weight: bold;">All Cards</h3>
        <div style="background: #1f2937; padding: 16px; border-radius: 8px;">${availHtml}</div>
      </div>
    </div>
  `;
  
  div.querySelector('#backBtn').onclick = () => { state.screen = 'menu'; render(); };
  div.querySelector('#logoutBtn').onclick = () => { state.currentPlayer = null; state.screen = 'login'; render(); };
  div.querySelector('#saveDeck').onclick = saveDeck;
  div.querySelector('#loadDeck').onchange = (e) => { if (e.target.files[0]) loadDeck(e.target.files[0]); };
  
  div.querySelectorAll('.addCard').forEach((btn, i) => {
    btn.onclick = () => { 
      state.decks[key].push(Object.assign({}, state.cards[i], { deckId: Date.now() + Math.random() })); 
      render(); 
    };
  });
  div.querySelectorAll('.remCard').forEach((btn, i) => {
    btn.onclick = (e) => { 
      e.stopPropagation(); 
      state.decks[key].splice(i, 1); 
      render(); 
    };
  });
  
  return div;
}

function GameBoard() {
  const div = document.createElement('div');
  
  if (!state.gameStarted) {
    div.className = 'container screen';
    
    let connUI = '';
    if (state.onlineMode && state.waitingForAnswer) {
      connUI = `
        <div class="card" style="background: rgba(30, 64, 175, 0.2); border-color: #3b82f6; margin-bottom: 24px;">
          <h3 class="mb-4" style="font-weight: bold;">📋 Step 1: Share This Code</h3>
          <textarea readonly class="input mb-4" rows="3" id="offerCode" style="font-size: 11px;">${state.roomCode}</textarea>
          <button id="copyOffer" class="btn btn-blue mb-4" style="width: 100%;">Copy Code</button>
          <hr style="border-color: #4b5563; margin: 16px 0;">
          <h3 class="mb-4" style="font-weight: bold;">📥 Step 2: Enter Their Response</h3>
          <textarea class="input mb-4" rows="3" id="answerInput" placeholder="Paste answer code..." style="font-size: 11px;"></textarea>
          <button id="submitAnswer" class="btn btn-green" style="width: 100%;">Connect</button>
        </div>
      `;
    } else if (state.onlineMode && state.answerCode) {
      connUI = `
        <div class="card" style="background: rgba(5, 150, 105, 0.2); border-color: #059669; margin-bottom: 24px;">
          <h3 class="mb-4" style="font-weight: bold;">✅ Send This Code Back</h3>
          <textarea readonly class="input mb-4" rows="3" id="answerCode" style="font-size: 11px;">${state.answerCode}</textarea>
          <button id="copyAnswer" class="btn btn-green" style="width: 100%;">Copy Answer Code</button>
          <p class="text-green text-sm mt-4">Waiting for host...</p>
        </div>
      `;
    } else if (state.onlineMode && state.dataChannel && state.dataChannel.readyState === 'open') {
      connUI = '<div class="card text-green mb-4">✅ Connected!</div>';
    }
    
    div.innerHTML = `
      <div style="max-width: 800px; width: 100%;">
        <div class="header">
          <button id="backBtn" class="btn btn-secondary text-sm">← Back</button>
          <button id="logoutBtn" class="btn btn-secondary text-sm">Logout</button>
        </div>
        ${connUI}
        <div class="text-center">
          <h1 class="mb-4" style="font-size: 28px; font-weight: bold;">Ready to Play?</h1>
          <p class="text-gray mb-8">${state.onlineMode ? 'Waiting for both players...' : 'Make sure both have decks!'}</p>
          <button id="startBtn" class="btn btn-primary" style="padding: 16px 32px;" ${state.decks.player1.length === 0 || state.decks.player2.length === 0 ? 'disabled' : ''}>Start Game</button>
          ${state.decks.player1.length === 0 || state.decks.player2.length === 0 ? '<p class="text-red mt-4">Both players need decks!</p>' : ''}
        </div>
      </div>
    `;
    
    if (div.querySelector('#copyOffer')) {
      div.querySelector('#copyOffer').onclick = () => {
        div.querySelector('#offerCode').select();
        document.execCommand('copy');
        alert('Code copied!');
      };
    }
    if (div.querySelector('#submitAnswer')) {
      div.querySelector('#submitAnswer').onclick = () => {
        const val = div.querySelector('#answerInput').value.trim();
        if (val) completeConnection(val);
        else alert('Paste the answer code first!');
      };
    }
    if (div.querySelector('#copyAnswer')) {
      div.querySelector('#copyAnswer').onclick = () => {
        div.querySelector('#answerCode').select();
        document.execCommand('copy');
        alert('Answer copied!');
      };
    }
    
    div.querySelector('#backBtn').onclick = () => { 
      if (state.onlineMode) disconnectOnline();
      state.screen = 'menu'; 
      render(); 
    };
    div.querySelector('#logoutBtn').onclick = () => { state.currentPlayer = null; state.screen = 'login'; render(); };
    div.querySelector('#startBtn').onclick = () => {
      const shuffle = (arr) => {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      };
      
      const p1 = shuffle(state.decks.player1.map((c, i) => ({ ...c, gameId: 'p1-' + i })));
      const p2 = shuffle(state.decks.player2.map((c, i) => ({ ...c, gameId: 'p2-' + i })));
      
      state.gameState = { 
        player1: { hand: [], upperField: [], lowerField: [], graveyard: [], deck: p1, health: 20 }, 
        player2: { hand: [], upperField: [], lowerField: [], graveyard: [], deck: p2, health: 20 } 
      };
      state.activePlayer = 1; 
      state.gameStarted = true;
      sendGameUpdate();
      render();
    };
    return div;
  }

  // Game screen (simplified for length)
  const pKey = 'player' + state.currentPlayer;
  const oKey = 'player' + (state.currentPlayer === 1 ? 2 : 1);
  const me = state.gameState[pKey];
  const opp = state.gameState[oKey];
  
  div.innerHTML = `
    <div style="display: flex; height: 100vh;">
      <div style="flex: 1; display: flex; flex-direction: column; overflow: hidden;">
        <div style="background: #1f2937; padding: 8px; display: flex; justify-content: space-between; align-items: center;">
          <button id="exitBtn" class="btn btn-secondary text-xs">← Exit</button>
          <span class="text-xs">Player ${state.activePlayer}${state.activePlayer === state.currentPlayer ? ' (YOU)' : ''}</span>
          <button id="endTurn" class="btn btn-blue text-xs">End Turn</button>
        </div>
        <div style="flex: 1; overflow-y: auto; padding: 16px;">
          <div class="text-center mb-4">
            <div class="text-red" style="font-weight: bold;">Opponent - LP: ${opp.health}</div>
            <div class="text-xs text-gray">Deck: ${opp.deck.length} | Hand: ${opp.hand.length} | GY: ${opp.graveyard.length}</div>
          </div>
          <div class="game-field mb-4" style="min-height: 110px;">
            <div class="text-xs text-gray text-center">Opponent Upper Field</div>
            ${opp.upperField.map((c, i) => `<div class="field-card" data-zone="upperField" data-owner="opp" data-idx="${i}"><img src="${c.image || ''}"></div>`).join('')}
          </div>
          <div class="game-field mb-4" style="min-height: 110px;">
            <div class="text-xs text-gray text-center">Opponent Lower Field</div>
            ${opp.lowerField.map((c, i) => `<div class="field-card" data-zone="lowerField" data-owner="opp" data-idx="${i}"><img src="${c.image || ''}"></div>`).join('')}
          </div>
          <div style="border-top: 2px solid #7c3aed; margin: 16px 0;"></div>
          <div class="game-field player mb-4" style="min-height: 110px;">
            <div class="text-xs text-gray text-center">Your Lower Field</div>
            ${me.lowerField.map((c, i) => `<div class="field-card" data-zone="lowerField" data-owner="me" data-idx="${i}"><img src="${c.image || ''}"></div>`).join('')}
          </div>
          <div class="game-field player mb-4" style="min-height: 110px;">
            <div class="text-xs text-gray text-center">Your Upper Field</div>
            ${me.upperField.map((c, i) => `<div class="field-card" data-zone="upperField" data-owner="me" data-idx="${i}"><img src="${c.image || ''}"></div>`).join('')}
          </div>
          <div class="text-center">
            <div class="text-green" style="font-weight: bold;">You - LP: ${me.health}</div>
            <div class="flex justify-between" style="margin-top: 8px;">
              <button id="drawBtn" class="btn btn-secondary text-xs">Draw(${me.deck.length})</button>
              <button id="viewGY" class="btn btn-secondary text-xs">GY(${me.graveyard.length})</button>
              <button id="minusLP" class="btn btn-red text-xs">-1 LP</button>
              <button id="plusLP" class="btn btn-green text-xs">+1 LP</button>
            </div>
          </div>
        </div>
        <div style="background: #1f2937; padding: 8px; height: 100px; overflow-x: auto; display: flex; justify-content: center; align-items: center;">
          ${me.hand.map((c, i) => `<div class="hand-card${state.selectedCard === i ? ' selected' : ''}" data-idx="${i}"><img src="${c.image || ''}"></div>`).join('') || '<span class="text-gray text-xs">No cards</span>'}
        </div>
      </div>
      <div class="sidebar">
        <h3 class="mb-4 text-center" style="font-weight: bold; font-size: 14px;">Card Info</h3>
        ${state.hoveredCard ? `
          <div class="card-preview">
            <div class="text-center mb-2" style="font-weight: bold;">${state.hoveredCard.name}</div>
            <div class="text-xs text-gray text-center mb-2">${state.hoveredCard.type}</div>
            ${state.hoveredCard.image ? `<img src="${state.hoveredCard.image}" style="width: 100%; border-radius: 6px; margin-bottom: 8px;">` : '<div class="card-img" style="height: 150px;">🃏</div>'}
            ${state.hoveredCard.type === 'Monster' ? `<div class="text-xs mb-2">ATK: ${state.hoveredCard.attack} | DEF: ${state.hoveredCard.defense}</div>` : ''}
            <div class="text-xs">${state.hoveredCard.effect}</div>
          </div>
        ` : '<p class="text-gray text-xs text-center">Hover over a card</p>'}
      </div>
    </div>
    ${state.selectedCard !== null && me.hand[state.selectedCard] ? `
      <div class="modal" style="align-items: flex-end; padding-bottom: 120px;">
        <div class="modal-content" style="max-width: 400px;">
          <div class="text-center mb-4">${me.hand[state.selectedCard].name}</div>
          <div class="flex" style="flex-wrap: wrap; gap: 8px;">
            <button class="btn btn-primary text-sm placeCard" data-zone="upper">Upper Field</button>
            <button class="btn btn-primary text-sm placeCard" data-zone="lower">Lower Field</button>
            <button id="discardCard" class="btn btn-red text-sm">Discard</button>
            <button id="toDeck" class="btn btn-green text-sm">To Deck</button>
            <button id="cancel" class="btn btn-secondary text-sm">Cancel</button>
          </div>
        </div>
      </div>
    ` : ''}
    ${state.winner ? `
      <div class="modal">
        <div class="modal-content text-center">
          <h2 class="mb-4" style="font-size: 32px; font-weight: bold;">${state.winner === state.currentPlayer ? 'You Win!' : 'You Lose!'}</h2>
          <p class="text-gray mb-8">Player ${state.winner} wins!</p>
          <button id="returnBtn" class="btn btn-primary" style="padding: 16px 32px;">Return to Menu</button>
        </div>
      </div>
    ` : ''}
  `;
  
  div.querySelector('#exitBtn').onclick = () => {
    if (state.onlineMode) disconnectOnline();
    state.screen = 'menu';
    state.gameStarted = false;
    state.winner = null;
    state.selectedCard = null;
    render();
  };
  
  div.querySelector('#drawBtn').onclick = () => {
    if (me.deck.length > 0) {
      const idx = Math.floor(Math.random() * me.deck.length);
      me.hand.push(me.deck[idx]);
      me.deck.splice(idx, 1);
      sendGameUpdate();
      render();
    }
  };
  
  div.querySelector('#viewGY').onclick = () => { state.viewingGraveyard = 'me'; render(); };
  div.querySelector('#minusLP').onclick = () => { me.health = Math.max(0, me.health - 1); checkWinner(); sendGameUpdate(); render(); };
  div.querySelector('#plusLP').onclick = () => { me.health++; sendGameUpdate(); render(); };
  div.querySelector('#endTurn').onclick = () => { state.activePlayer = state.activePlayer === 1 ? 2 : 1; state.selectedCard = null; sendGameUpdate(); render(); };
  
  if (state.selectedCard !== null && div.querySelector('#discardCard')) {
    div.querySelector('#discardCard').onclick = () => {
      me.graveyard.push(me.hand[state.selectedCard]);
      me.hand.splice(state.selectedCard, 1);
      state.selectedCard = null;
      sendGameUpdate();
      render();
    };
    div.querySelector('#toDeck').onclick = () => {
      me.deck.push(me.hand[state.selectedCard]);
      me.hand.splice(state.selectedCard, 1);
      state.selectedCard = null;
      sendGameUpdate();
      render();
    };
    div.querySelector('#cancel').onclick = () => { state.selectedCard = null; render(); };
    div.querySelectorAll('.placeCard').forEach(btn => {
      btn.onclick = () => {
        const zone = btn.dataset.zone + 'Field';
        me[zone].push(me.hand[state.selectedCard]);
        me.hand.splice(state.selectedCard, 1);
        state.selectedCard = null;
        sendGameUpdate();
        render();
      };
    });
  }
  
  if (state.winner && div.querySelector('#returnBtn')) {
    div.querySelector('#returnBtn').onclick = () => {
      if (state.onlineMode) disconnectOnline();
      state.screen = 'menu';
      state.gameStarted = false;
      state.winner = null;
      state.selectedCard = null;
      render();
    };
  }
  
  div.querySelectorAll('.hand-card').forEach((card, i) => {
    card.onclick = () => { state.selectedCard = state.selectedCard === i ? null : i; render(); };
    card.onmouseenter = () => { state.hoveredCard = me.hand[i]; render(); };
  });
  
  div.querySelectorAll('.field-card').forEach(card => {
    card.onmouseenter = () => {
      const zone = card.dataset.zone;
      const owner = card.dataset.owner;
      const idx = parseInt(card.dataset.idx);
      state.hoveredCard = owner === 'me' ? me[zone][idx] : opp[zone][idx];
      render();
    };
  });
  
  return div;
}

setTimeout(render, 100);

})();
  </script>
</body>
</html>
