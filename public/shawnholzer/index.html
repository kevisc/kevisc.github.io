<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shawn Holzer - Music</title>
    <script src="https://unpkg.com/@strudel/embed@latest"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #16161d;
            --bg-tertiary: #1e1e28;
            --accent: #A7BAD1;
            --accent-hover: #A4B1BF;
            --text-primary: #e5e5e7;
            --text-secondary: #a1a1aa;
            --border: #2d2d3a;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }

        header {
            text-align: left;
            margin-bottom: 3rem;
            padding-bottom: 2rem;
            border-bottom: 1px solid var(--border);
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent), var(--accent-hover));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1rem;
            letter-spacing: 0.05em;
        }

        .music-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .strudel-section {
            background: var(--bg-secondary);
            border-radius: 16px;
            border: 1px solid var(--border);
            margin-bottom: 3rem;
            overflow: hidden;
        }

        .strudel-section .tile-header {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.1), rgba(129, 140, 248, 0.1));
        }

        .music-tile {
            background: var(--bg-secondary);
            border-radius: 16px;
            border: 1px solid var(--border);
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .music-tile:hover {
            border-color: var(--accent);
            transform: translateY(-4px);
        }

        .tile-header {
            padding: 1.5rem;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tile-title {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .tile-subtitle {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-top: 0.25rem;
        }

        .expand-icon {
            font-size: 1.5rem;
            transition: transform 0.3s ease;
        }

        .expand-icon.expanded {
            transform: rotate(180deg);
        }

        .tile-content {
            padding: 0 1.5rem 1.5rem 1.5rem;
        }

        .embedded-content {
            padding: 1.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 350px;
            background: var(--bg-tertiary);
        }

        .embedded-content iframe {
            border-radius: 8px;
        }

        .bandcamp-player {
            border: 0;
            width: 350px;
            height: 470px;
        }

        .bandcamp-player.square {
            height: 350px;
        }

        /* Strudel specific styles */
        .strudel-expanded {
            display: none;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .strudel-expanded.active {
            display: block;
            max-height: 2000px;
            overflow: visible;
        }

        .strudel-layout {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 1.5rem;
            padding: 1.5rem;
        }

        .track-list {
            background: var(--bg-tertiary);
            border-radius: 12px;
            padding: 1rem;
            max-height: 700px;
            overflow-y: auto;
        }

        .track-list h3 {
            font-size: 1rem;
            margin-bottom: 0.75rem;
            color: var(--text-secondary);
        }

        .track-item {
            background: var(--bg-secondary);
            padding: 0.875rem;
            margin-bottom: 0.5rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid transparent;
        }

        .track-item:hover {
            background: var(--bg-primary);
            border-color: var(--accent);
        }

        .track-item.active {
            background: var(--bg-primary);
            border-color: var(--accent);
        }

        .track-item h4 {
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .track-item p {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .player-area {
            background: var(--bg-tertiary);
            border-radius: 12px;
            padding: 1rem;
        }

        .player-header {
            margin-bottom: 1rem;
        }

        .current-track-title {
            font-size: 1.125rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .current-track-meta {
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        .strudel-container {
            border-radius: 8px;
            overflow: hidden;
            background: #000;
            min-height: 650px;
        }

        strudel-repl {
            display: block;
            width: 100%;
            height: 650px;
            min-height: 650px;
        }

        strudel-repl iframe {
            width: 100% !important;
            height: 100% !important;
            min-height: 650px !important;
            border: none;
        }

        .strudel-credit {
            text-align: center;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        .strudel-credit a {
            color: var(--accent);
            text-decoration: none;
        }

        .strudel-credit a:hover {
            text-decoration: underline;
        }

        .empty-state {
            padding: 3rem;
            text-align: center;
            color: var(--text-secondary);
        }

        .platforms {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-bottom: 3rem;
        }

        .platform-link {
            background: var(--bg-secondary);
            padding: 1.5rem;
            border-radius: 12px;
            text-decoration: none;
            color: var(--text-primary);
            border: 1px solid var(--border);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .platform-link:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .platform-icon {
            font-size: 2rem;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-tertiary);
            border-radius: 10px;
        }

        .platform-text h3 {
            font-size: 1.125rem;
            margin-bottom: 0.25rem;
        }

        .platform-text p {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        footer {
            text-align: center;
            padding: 2rem 0;
            color: var(--text-secondary);
            font-size: 0.875rem;
            border-top: 1px solid var(--border);
            margin-top: 3rem;
        }

        /* Responsive YouTube iframes */
        .youtube-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 aspect ratio */
            height: 0;
            overflow: hidden;
            width: 100%;
            max-width: 560px;
        }

        .youtube-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }

            .music-grid {
                grid-template-columns: 1fr;
            }

            .strudel-layout {
                grid-template-columns: 1fr;
            }

            .track-list {
                max-height: 300px;
            }

            strudel-repl {
                height: 500px;
            }

            .platforms {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 480px) {
            .embedded-content {
                padding: 1rem;
            }
            
            .embedded-content iframe {
                width: 100% !important;
                max-width: 350px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Shawn Holzer</h1>
            <p class="subtitle">Some of my projects:</p>
        </header>

        <!-- Strudel Section - Full Width -->
        <div class="strudel-section">
            <div class="tile-header" onclick="toggleStrudel()">
                <div>
                    <div class="tile-title">Strudel Live Code</div>
                    <div class="tile-subtitle">Interactive generative music</div>
                </div>
                <div class="expand-icon" id="strudelIcon">▼</div>
            </div>
            <div class="strudel-expanded" id="strudelContent">
                <div class="strudel-layout">
                    <div class="track-list">
                        <h3>Tracks</h3>
                        <div id="trackList"></div>
                    </div>
                    <div class="player-area">
                        <div class="player-header">
                            <div class="current-track-title" id="currentTitle">Select a track</div>
                            <div class="current-track-meta" id="currentMeta"></div>
                        </div>
                        <div class="strudel-container" id="strudelContainer">
                            <div class="empty-state">
                                <p>👈 Select a track to load</p>
                            </div>
                        </div>
                        <div class="strudel-credit">
                            Made with <a href="https://strudel.cc" target="_blank" rel="noopener noreferrer">Strudel</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="music-grid">
            <!-- Bandcamp Track 1: IC18 BE-ZH -->
            <div class="music-tile">
                <div class="embedded-content">
                    <iframe class="bandcamp-player square" src="https://bandcamp.com/EmbeddedPlayer/track=1320971702/size=large/bgcol=16161d/linkcol=A7BAD1/minimal=true/transparent=true/" seamless></iframe>
                </div>
            </div>

            <!-- Bandcamp Track 2: Endings -->
            <div class="music-tile">
                <div class="embedded-content">
                    <iframe class="bandcamp-player square" src="https://bandcamp.com/EmbeddedPlayer/track=4047944957/size=large/bgcol=16161d/linkcol=A7BAD1/minimal=true/transparent=true/" seamless></iframe>
                </div>
            </div>

            <!-- YouTube Video 1 -->
            <div class="music-tile">
                <div class="embedded-content">
                    <div class="youtube-wrapper">
                        <iframe src="https://www.youtube-nocookie.com/embed/yQ50yfZ_lOY" title="YouTube video player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                    </div>
                </div>
            </div>

            <!-- YouTube Video 2 -->
            <div class="music-tile">
                <div class="embedded-content">
                    <div class="youtube-wrapper">
                        <iframe src="https://www.youtube-nocookie.com/embed/_EVD6QPpSM8" title="YouTube video player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                    </div>
                </div>
            </div>
        </div>

        <div class="platforms">
            <a href="https://shawnholzer.bandcamp.com/" target="_blank" rel="noopener noreferrer" class="platform-link">
                <div class="platform-icon">🎵</div>
                <div class="platform-text">
                    <h3>Bandcamp</h3>
                    <p>Albums & releases</p>
                </div>
            </a>
            <a href="https://www.youtube.com/@DrummerSchon" target="_blank" rel="noopener noreferrer" class="platform-link">
                <div class="platform-icon">▶️</div>
                <div class="platform-text">
                    <h3>YouTube</h3>
                    <p>Videos & performances</p>
                </div>
            </a>
            <a href="https://soundcloud.com/shawnholzer" target="_blank" rel="noopener noreferrer" class="platform-link">
                <div class="platform-icon">☁️</div>
                <div class="platform-text">
                    <h3>SoundCloud</h3>
                    <p>Tracks & mixes</p>
                </div>
            </a>
        </div>

        <footer>
            <p>Shawn Holzer 2025</p>
        </footer>
    </div>

    <script>
        // Track library
        const tracks = [
            {
                id: 1,
                title: "Minor Meditation",
                bpm: 35,
                description: "Dark ambient in G minor",
                code: `setcps(35/60)
$: n("<0 4 0 9 7>*16".add("<7 _ _ 6 5 _ _ 6>*2")).scale("g:minor").trans(0) 
.s("triangle").lpf(200)
  .delay(.4)
  .fm(0.5).fmwave('white')
._pianoroll()
$:s("bossdr55_bd :2!4")
  .duck("3:4:5:6")
  .duckdepth(0.8)
  .duckattack(.16)
  ._scope()
$: n("<7 _ _ 6 5 _ <5 3> <6 4>>*2").scale("g:minor").trans(-12) 
  .detune(rand)
.s("supersaw").lpf(400)
._pianoroll()
._scope()
$: n("<0 4 0>*16".add("<7 _ _ 6 5 _ _ 6>*2")).scale("g:minor").trans(0) 
.s("gm_shakuhachi").lpf(1600).attack(0.2)
  .delay(.1)
._pianoroll()
$: n("<7 _ _ 6 5 _ <5 3> <6 4>>*0.5").scale("g:minor").trans(0) 
  .s("sine")
  .fm(0.4)
  .fmh(1.001)
  .detune(rand)
._scope()`
            },
            {
                id: 2,
                title: "November Sundays",
                bpm: 32,
                description: "Atmospheric progressive",
                code: `setcps(32/60)
$: note("<[d4 fs4 a4] [e4 gs4 b4] [cs4 e4 a4] [d4 fs4 a4]>*4/32")
  .s("gm_tubular_bells")
  .detune(rand)
  .lpf(1200)
  .room(0.8).size(0.9)
  .gain(0.4)
  .cutoff(perlin.range(200, 1200).slow(8))
._pianoroll()
$: n("<[0 4 7 12] [2 5 9 14] [-3 0 4 9] [0 4 7 12]>*2/3")
  .scale("a:minor")
  .s("gm_lead_6_voice")
  .lpf(1000)
  .delay(0.3).delaytime(0.125)
  .gain(0.5)
  .sometimes(add(note("7")))
._pianoroll()
$: note("<a1 b1 gs1 a1>").transpose(+12)
  .s("supersaw")
  .detune(rand)
  .room(0.7)
  .delay(0.3)
  .gain(0.7)
  .lpf(620)
._pianoroll()
$: s("bd:2*4")
  .gain(0.55)
  .lpf(400)
._scope()
$: s("hh:8*4")
  .gain(0.2)
  .pan(rand)
  .room(0.2).size(0.3)
  .delay(0.4)
  .lpf(8000)
  .often(x => x.degradeBy(0.3))
$: n("<7 9 0 9 7 4 2 0>*16/5")
  .scale("a:minor")
  .s("gm_lead_3_calliope")
  .lpf(sine.range(1000, 4000).slow(4))
  .gain(0.6).delay(.8).delaytime(2/3).delayspeed(2)
  .room(0.3).size(0.7)
  .attack(0.1).decay(0.3)
  .sometimes(add(note("7")))
  .slow(2)
._pianoroll()`
            }
        ];

        let currentTrackId = null;
        let strudelExpanded = false;

        // Toggle Strudel section
        function toggleStrudel() {
            strudelExpanded = !strudelExpanded;
            const content = document.getElementById('strudelContent');
            const icon = document.getElementById('strudelIcon');
            
            if (strudelExpanded) {
                content.classList.add('active');
                icon.classList.add('expanded');
                // Auto-load first track if none selected
                if (currentTrackId === null && tracks.length > 0) {
                    loadTrack(tracks[0].id);
                }
            } else {
                content.classList.remove('active');
                icon.classList.remove('expanded');
            }
        }

        // Render track list
        function renderTracks() {
            const trackListEl = document.getElementById('trackList');
            trackListEl.innerHTML = tracks.map(track => `
                <div class="track-item" data-track-id="${track.id}">
                    <h4>${track.title}</h4>
                    <p>${track.description} · ${track.bpm} BPM</p>
                </div>
            `).join('');

            // Add click handlers
            document.querySelectorAll('.track-item').forEach(item => {
                item.addEventListener('click', () => {
                    const trackId = parseInt(item.dataset.trackId);
                    loadTrack(trackId);
                });
            });
        }

        // Load a track into the Strudel player
        function loadTrack(trackId) {
            const track = tracks.find(t => t.id === trackId);
            if (!track) return;

            currentTrackId = trackId;

            // Update UI
            document.getElementById('currentTitle').textContent = track.title;
            document.getElementById('currentMeta').textContent = `${track.description} · ${track.bpm} BPM`;

            // Update active state
            document.querySelectorAll('.track-item').forEach(item => {
                item.classList.remove('active');
                if (parseInt(item.dataset.trackId) === trackId) {
                    item.classList.add('active');
                }
            });

            // Load the track into Strudel - using innerHTML with proper formatting
            const container = document.getElementById('strudelContainer');
            container.innerHTML = '<strudel-repl><!--\n' + track.code + '\n--></strudel-repl>';
        }

        // Initialize
        renderTracks();
    </script>
</body>
</html>
