              <Divider />
              <Section title="Reverb (generated IR)">
                <Slider label="Size (s)" min={0.2} max={3} step={0.01} value={fx.revSize} onChange={(v)=>setFx(s=>({...s,revSize:v}))} format={(v)=>v.toFixed(2)} />
                <Slider label="Decay" min={0.2} max={6} step={0.05} value={fx.revDecay} onChange={(v)=>setFx(s=>({...s,revDecay:v}))} format={(v)=>v.toFixed(2)} />
                <Slider label="Mix" min={0} max={1} step={0.01} value={fx.revMix} onChange={(v)=>setFx(s=>({...s,revMix:v}))} format={(v)=>v.toFixed(2)} />
                <div className="text-[11px] text-slate-400">Impulse response is regenerated when size/decay changes (debounced).</div>
              </Section>
            </Card>
          )}

          {tab === "rings" && (
            <Card title="Rings (Modal Resonator)" right={<Pill tone={ringsCfg.enabled ? "emerald":"slate"}>{ringsCfg.enabled?"Enabled":"Disabled"}</Pill>}>
              <Section title="Routing">
                <Toggle label="Enabled" checked={ringsCfg.enabled} onChange={(c)=>setRingsCfg(s=>({...s,enabled:c}))} />
                <Toggle label="Use external exciter (from VCO mix)" checked={ringsCfg.external} onChange={(c)=>setRingsCfg(s=>({...s,external:c}))} disabled={!ringsCfg.enabled}/>
                <Toggle label="Follow played pitch" checked={ringsCfg.followPitch} onChange={(c)=>setRingsCfg(s=>({...s,followPitch:c}))} disabled={!ringsCfg.enabled}/>
                <Toggle label="Auto strike on Note On" checked={ringsCfg.autoStrike} onChange={(c)=>setRingsCfg(s=>({...s,autoStrike:c}))} disabled={!ringsCfg.enabled}/>
                <div className="flex gap-2">
                  <Button onClick={strikeRings} disabled={!audioReady || !ringsCfg.enabled} tone="emerald">Strike</Button>
                </div>
              </Section>
              <Divider />
              <Section title="Pitch & Mix">
                <Slider label="Pitch (MIDI)" min={24} max={96} step={1} value={ringsCfg.pitch} onChange={(v)=>setRingsCfg(s=>({...s,pitch:v}))} format={(v)=>`${v} (${midiToName(v)})`} disabled={!ringsCfg.enabled}/>
                <Slider label="Wet mix" min={0} max={1} step={0.01} value={ringsCfg.mix} onChange={(v)=>setRingsCfg(s=>({...s,mix:v}))} format={(v)=>v.toFixed(2)} disabled={!ringsCfg.enabled}/>
              </Section>
              <Divider />
              <Section title="Resonator">
                <Slider label="Structure (inharmonicity)" min={0} max={1} step={0.001} value={ringsCfg.structure} onChange={(v)=>setRingsCfg(s=>({...s,structure:v}))} format={(v)=>v.toFixed(3)} disabled={!ringsCfg.enabled}/>
                <Slider label="Brightness (spectral tilt)" min={0} max={1} step={0.001} value={ringsCfg.brightness} onChange={(v)=>setRingsCfg(s=>({...s,brightness:v}))} format={(v)=>v.toFixed(3)} disabled={!ringsCfg.enabled}/>
                <Slider label="Damping (decay)" min={0} max={1} step={0.001} value={ringsCfg.damping} onChange={(v)=>setRingsCfg(s=>({...s,damping:v}))} format={(v)=>v.toFixed(3)} disabled={!ringsCfg.enabled}/>
                <Slider label="Position (mode weighting)" min={0} max={1} step={0.001} value={ringsCfg.position} onChange={(v)=>setRingsCfg(s=>({...s,position:v}))} format={(v)=>v.toFixed(3)} disabled={!ringsCfg.enabled}/>
              </Section>
              <Divider />
              <Section title="Rings Modulation" hint="Filter & ADSR for Rings">
                <Toggle label="ADSR envelope on Rings" checked={ringsCfg.envEnabled} onChange={(c)=>setRingsCfg(s=>({...s,envEnabled:c}))} disabled={!ringsCfg.enabled || !env.enabled}/>
                <div className="text-[11px] text-slate-400 mb-2">
                  {ringsCfg.envEnabled ? "Rings amplitude follows the main ADSR envelope" : "Rings plays freely without envelope shaping"}
                </div>
                <Toggle label="Filter on Rings output" checked={ringsCfg.filterEnabled} onChange={(c)=>setRingsCfg(s=>({...s,filterEnabled:c}))} disabled={!ringsCfg.enabled}/>
                <Slider label="Filter cutoff (Hz)" min={20} max={20000} step={1} value={ringsCfg.filterCutoff} onChange={(v)=>setRingsCfg(s=>({...s,filterCutoff:v}))} format={(v)=>Math.round(v)} disabled={!ringsCfg.enabled || !ringsCfg.filterEnabled}/>
                <Slider label="Filter Q" min={0.1} max={20} step={0.01} value={ringsCfg.filterQ} onChange={(v)=>setRingsCfg(s=>({...s,filterQ:v}))} format={(v)=>v.toFixed(2)} disabled={!ringsCfg.enabled || !ringsCfg.filterEnabled}/>
                <Slider label="Env -> Filter (Hz)" min={-8000} max={8000} step={1} value={ringsCfg.filterEnvAmt} onChange={(v)=>setRingsCfg(s=>({...s,filterEnvAmt:v}))} format={(v)=>Math.round(v)} disabled={!ringsCfg.enabled || !ringsCfg.filterEnabled}/>
                <Slider label="LFO -> Filter (Hz)" min={0} max={6000} step={1} value={ringsCfg.filterLfoAmt} onChange={(v)=>setRingsCfg(s=>({...s,filterLfoAmt:v}))} format={(v)=>Math.round(v)} disabled={!ringsCfg.enabled || !ringsCfg.filterEnabled}/>
              </Section>
              <Divider />
              <Section title="Mic input (optional)">
                <Toggle label="Enable mic routing" checked={mic.enabled} onChange={(c)=>setMic(s=>({...s,enabled:c}))} disabled={!audioReady}/>
                <Slider label="Mic level" min={0} max={1} step={0.01} value={mic.gain} onChange={(v)=>setMic(s=>({...s,gain:v}))} format={(v)=>v.toFixed(2)} disabled={!audioReady || !mic.enabled}/>
                <Button onClick={startMic} disabled={!audioReady} title="Ask permission and route microphone into the synth mixer">Start Mic</Button>
                <div className="text-[11px] text-slate-400">Useful to excite the resonator with external sound. (Mic permission required.)</div>
              </Section>
            </Card>
          )}

          {tab === "scope" && (
            <Card title="Scope & Analysis">
              <Section title="Source">
                <Select label="Analyser tap" value={scopeCfg.source} onChange={(v)=>setScopeCfg(s=>({...s,source:v}))}
                  options={[{value:"post",label:"Post FX (default)"},{value:"pre",label:"Pre FX (raw voice)"}]}
                />
              </Section>
              <Divider />
              <Section title="Display">
                <Select label="Mode" value={scopeCfg.mode} onChange={(v)=>setScopeCfg(s=>({...s,mode:v}))}
                  options={[{value:"rolling",label:"Rolling"},{value:"single",label:"Single-cycle (triggered)"}]}
                />
                <Slider label="Gain (vertical)" min={0.2} max={6} step={0.01} value={scopeCfg.gain} onChange={(v)=>setScopeCfg(s=>({...s,gain:v}))} format={(v)=>v.toFixed(2)} />
                <Toggle label="AC coupling (remove DC)" checked={scopeCfg.ac} onChange={(c)=>setScopeCfg(s=>({...s,ac:c}))} />
              </Section>
              <Divider />
              <Section title="Trigger">
                <Slider label="Level" min={-1} max={1} step={0.01} value={scopeCfg.triggerLevel} onChange={(v)=>setScopeCfg(s=>({...s,triggerLevel:v}))} format={(v)=>v.toFixed(2)} />
                <Select label="Slope" value={scopeCfg.slope} onChange={(v)=>setScopeCfg(s=>({...s,slope:v}))}
                  options={[{value:"+",label:"Rising"},{value:"-",label:"Falling"}]}
                />
                <Toggle label="Auto trigger fallback" checked={scopeCfg.autoTrigger} onChange={(c)=>setScopeCfg(s=>({...s,autoTrigger:c}))} />
              </Section>
              <Divider />
              <Section title="Rendering">
                <Slider label="Smoothing" min={0} max={0.9} step={0.01} value={scopeCfg.smoothing} onChange={(v)=>setScopeCfg(s=>({...s,smoothing:v}))} format={(v)=>v.toFixed(2)} />
                <Slider label="Line width" min={1} max={4} step={0.1} value={scopeCfg.lineWidth} onChange={(v)=>setScopeCfg(s=>({...s,lineWidth:v}))} format={(v)=>v.toFixed(1)} />
              </Section>
              <div className="text-[11px] text-slate-400">
                Tip: if the trace is flat, increase gain, enable AC coupling, or switch to Rolling mode.
              </div>
            </Card>
          )}

          {tab === "seq" && (
            <Card title="Step Sequencer" right={<Pill tone={seq.enabled?"emerald":"slate"}>{seq.enabled?"Playing":"Stopped"}</Pill>}>
              <Section title="Transport">
                <Toggle label="Enable sequencer" checked={seq.enabled} onChange={(c)=>setSeq(s=>({...s,enabled:c}))}/>
                <Toggle label="Rings only (no oscillators)" checked={seq.ringsOnly} onChange={(c)=>setSeq(s=>({...s,ringsOnly:c}))}/>
                <Slider label="BPM" min={40} max={220} step={1} value={seq.bpm} onChange={(v)=>setSeq(s=>({...s,bpm:v}))} format={(v)=>v.toFixed(0)} />
                <Slider label="Gate" min={0.05} max={0.95} step={0.01} value={seq.gate} onChange={(v)=>setSeq(s=>({...s,gate:v}))} format={(v)=>v.toFixed(2)} disabled={seq.ringsOnly}/>
                <Slider label="Swing" min={0} max={0.45} step={0.01} value={seq.swing} onChange={(v)=>setSeq(s=>({...s,swing:v}))} format={(v)=>v.toFixed(2)} />
                <div className="flex flex-wrap gap-2">
                  <Button onClick={randomizeSeq}>Random</Button>
                  <Button onClick={clearSeq}>Clear</Button>
                  <Button onClick={seqPatterns.fourOnFloor}>4/4</Button>
                  <Button onClick={seqPatterns.arpUp}>Arp Up</Button>
                  <Button onClick={seqPatterns.arpDown}>Arp Down</Button>
                  <Button onClick={seqPatterns.bassline}>Bass</Button>
                  <Button onClick={seqPatterns.euclidean}>Euclidean</Button>
                </div>
                {seq.ringsOnly && !ringsCfg.enabled && (
                  <div className="text-[11px] text-amber-400 mt-2">
                    Note: Enable Rings in the Rings tab for Rings-only mode to work.
                  </div>
                )}
              </Section>
              <Divider />
              <Section title="Steps" hint={`${seq.steps.length} steps · Click to edit`}>
                <div className="flex items-center gap-2 mb-3">
                  <span className="text-[11px] text-slate-400">Steps:</span>
                  <select
                    value={String(seq.steps.length)}
                    onChange={(e) => {
                      const newLen = parseInt(e.target.value, 10);
                      setSeq(s => {
                        const newSteps = [...s.steps];
                        while (newSteps.length < newLen) newSteps.push(null);
                        return { ...s, steps: newSteps.slice(0, newLen) };
                      });
                    }}
                    className="bg-slate-900/60 border border-slate-700/60 rounded-lg px-2 py-1 text-xs"
                  >
                    <option value="8">8</option>
                    <option value="16">16</option>
                    <option value="24">24</option>
                    <option value="32">32</option>
                  </select>
                  {seq.enabled && currentStep >= 0 && (
                    <span className="text-emerald-400 text-[11px] ml-auto">
                      Step {(currentStep % seq.steps.length) + 1}/{seq.steps.length}
                    </span>
                  )}
                </div>
                <div className="grid grid-cols-4 gap-2">
                  {seq.steps.map((st, i) => {
                    const isActive = seq.enabled && currentStep >= 0 && (currentStep % seq.steps.length) === i;
                    return (
                      <div key={i} className={clsx(
                        "rounded-xl border p-2 transition-all duration-75",
                        isActive
                          ? "border-emerald-500/70 bg-emerald-900/30 shadow-[0_0_8px_rgba(16,185,129,0.3)]"
                          : "border-slate-800/70 bg-slate-950/30"
                      )}>
                        <div className={clsx("text-[11px] mb-1", isActive ? "text-emerald-300" : "text-slate-400")}>
                          {i+1}
                        </div>
                        <select
                          value={st==null ? "rest" : String(st)}
                          onChange={(e)=>setStep(i, e.target.value)}
                          className={clsx(
                            "w-full border rounded-lg px-2 py-1.5 text-xs",
                            isActive
                              ? "bg-emerald-900/40 border-emerald-600/50"
                              : "bg-slate-900/60 border-slate-700/60"
                          )}
                        >
                          <option value="rest">--</option>
                          {Array.from({length:49}, (_,k)=>36+k).map(m => (
                            <option key={m} value={String(m)}>{midiToName(m)}</option>
                          ))}
                        </select>
                      </div>
                    );
                  })}
                </div>
                <div className="text-[11px] text-slate-400 mt-2">
                  Tip: Import a MIDI file to load note patterns. Sequencer uses the global ADSR envelope.
                </div>
              </Section>
            </Card>
          )}

          <div className="text-[10px] text-slate-500 px-1">
            Created by Kevin Schoenholzer with the help of ChatGPT, 2025 · For educational use only.
          </div>
        </aside>

        {/* Visuals / performance */}
        <main className="h-full overflow-y-auto p-4 lg:p-6 space-y-4 gridbg">
          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            <Card title="Time Scope" right={<Pill>Peak <span className="tabular-nums">{meter.peak.toFixed(3)}</span></Pill>}>
              <div className="h-[32vh] md:h-[30vh]">
                <canvas ref={setScopeEl} className="w-full h-full block rounded-xl overflow-hidden"></canvas>
              </div>
            </Card>

            <Card title="Spectrum" right={<Pill>Source: {scopeCfg.source}</Pill>}>
              <div className="h-[32vh] md:h-[30vh]">
                <canvas ref={setSpecEl} className="w-full h-full block rounded-xl overflow-hidden"></canvas>
              </div>
            </Card>
          </div>

          <Card title="Keyboard" right={<Pill tone="slate">Click / touch · latch optional</Pill>}>
            <Piano
              baseMidi={voice.note}
              octaves={2}
              latch={voice.latch}
              heldMidi={heldMidi}
              setHeldMidi={setHeldMidi}
              onDown={(m)=>{ if(!audioReady) return; noteOn(m, 1.0); }}
              onUp={(m)=>{ if(!audioReady) return; noteOff(); }}
            />
            <div className="mt-3 grid grid-cols-1 md:grid-cols-3 gap-3 text-[11px] text-slate-400">
              <div><span className="text-slate-200">Quick start:</span> Start Audio → play keys → add Drive or Reverb → Record.</div>
              <div><span className="text-slate-200">Resonator:</span> Enable Rings, press Space to strike, or use Seq with Rings-only mode.</div>
              <div><span className="text-slate-200">Import:</span> Load JSON presets or MIDI files to populate the sequencer.</div>
            </div>
          </Card>
        </main>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
    </script>
  </body>
</html>
